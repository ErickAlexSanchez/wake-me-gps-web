<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">WakeMeGPS lettermark horizontal</title>
  <desc id="logo-desc">W inside a ring beside the WakeMeGPS wordmark.</desc>
  <g id="logo-symbol" transform="translate(20 20) scale(0.3516)">
