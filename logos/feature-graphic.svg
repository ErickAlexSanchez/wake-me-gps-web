<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">WakeMeGPS feature graphic</title>
  <desc id="logo-desc">Night-green banner with the geofence mark and the name WakeMeGPS.</desc>
  <rect width="1024" height="500" fill="#1a2420"/>
  <circle cx="300" cy="250" r="210" fill="none" stroke="#ffb000" stroke-width="18" opacity="0.22"/>
  <g id="logo-symbol" fill="none">
    <circle cx="300" cy="250" r="112" stroke="#ffb000" stroke-width="22"/>
    <circle cx="300" cy="250" r="26" fill="#ffb000" stroke="none"/>
  </g>
  <g id="logo-text">
    <text x="470" y="236" fill="#ffb000" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">WakeMeGPS</text>
    <text x="472" y="292" fill="#f4efe2" font-family="Segoe UI, Arial, sans-serif" font-size="28">Te despierta al llegar</text>
  </g>
</svg>
